server {
    listen 80;
    index index.php index.html;
    server_name localhost;
    root /var/www/html/public;
    # ✅ 1. Handle normal web routes
    # Breakdown:
    # $uri = The path in the URL (e.g., /about)

    # try_files = Tries to find that path as a file or folder.

    # If it doesn’t exist, pass the request to index.php, along with the query string (?something=value).

    # 🧠 Why?
    # This is Laravel's "pretty URL" magic: All routes like /home, /blog/post/2 get passed to index.php,
    # which Laravel then handles with its router.


    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # $ means "end of the string". ~ \.php$ means Match any URL that ends with .php
    # ✅ Handle .php files (mostly just index.php in Laravel)
    location ~ \.php$ {
        fastcgi_pass app:9000;// Sends the request to the PHP-FPM server at app:9000
        include fastcgi_params;// Includes standard parameters Nginx needs to pass to PHP
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;// Tells PHP where the actual script file is (e.g., /var/www/html/public/index.php)
        fastcgi_param PATH_INFO $fastcgi_script_name;// PATH_INFO is for PHP scripts that rely on additional URL info
    }

# ~ /\.ht means the url request path including /.ht
    location ~ /\.ht {
        deny all;
    }
}